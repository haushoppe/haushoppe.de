name: deploy

# Nach jedem Merge auf main: bauen (Daten + i18n-Check + beide Sprachen) und beide
# Cloudflare-Pages-Projekte automatisch deployen. Schlägt Build oder Check fehl,
# wird NICHT deployt. Manuell auslösbar über „Run workflow" (workflow_dispatch).
# Zusätzlich nächtlich (03:00 UTC): der Build zieht dabei die aktuelle YouTube-Playlist
# (scripts/gen-videos.mjs), sodass neue Videos automatisch auf der Seite erscheinen.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Token = Secret (dedizierter CI-Token, nur „Cloudflare Pages: Edit"). Account-ID ist
      # kein Credential und darf im Klartext stehen.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 95a53d0584028b2a64d1a3a991a7fd14
      # YouTube-Data-API-Key für scripts/gen-videos.mjs (im data-Step). Fehlt der Key,
      # behält der Generator die committete Liste — der Build bricht NICHT ab.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Astros Bild-Cache (node_modules/.astro) wiederverwenden -> nur geänderte Werke neu codieren.
      # Key rollt pro Commit (github.sha), sonst speichert actions/cache nach dem ersten Treffer nie
      # wieder und der Cache friert ein. restore-keys holt den zuletzt gespeicherten Stand.
      - name: Astro-Bild-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.sha }}
          restore-keys: |
            astro-assets-

      - name: Bauen (Daten + i18n-Check + beide Sprachen)
        run: npm run build

      - name: Deploy haushoppe.de (dist-de)
        run: npm run deploy:de

      - name: Deploy haushoppe.art (dist-art)
        run: npm run deploy:art
