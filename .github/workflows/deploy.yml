name: deploy

# Nach jedem Merge auf main: bauen (Daten + i18n-Check + beide Sprachen) und beide
# Cloudflare-Pages-Projekte automatisch deployen. Schlägt Build oder Check fehl,
# wird NICHT deployt. Manuell auslösbar über „Run workflow" (workflow_dispatch).
# Zusätzlich nächtlich (03:00 UTC): der Build zieht dabei die aktuelle YouTube-Playlist
# (scripts/gen-videos.mjs), sodass neue Videos automatisch auf der Seite erscheinen.
on:
  push:
    branches: [main]
    # Reine Doku-/Test-Änderungen berühren den gebauten Output nicht → kein Redeploy.
    # (Werk-Inhalte liegen in src/content/**, nicht hier — die deployen weiterhin.)
    paths-ignore:
      - 'CLAUDE.md'
      - 'CLAUDE-admin.md'
      - '**/README.md'
      - 'e2e/**'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

# contents: write — NUR für den Nutzdaten-Rücklauf (letzter Step committet die vom Build
# regenerierte videos.json zurück, sonst driftet git vom Live-Stand).
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Token = Secret (dedizierter CI-Token, nur „Cloudflare Pages: Edit"). Account-ID ist
      # kein Credential und darf im Klartext stehen.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 95a53d0584028b2a64d1a3a991a7fd14
      # YouTube-Data-API-Key für scripts/gen-videos.mjs (im data-Step). Fehlt der Key,
      # behält der Generator die committete Liste — der Build bricht NICHT ab.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Astros Bild-Cache (node_modules/.astro) wiederverwenden -> nur geänderte Werke neu codieren.
      # Key hängt am INHALT der Bildquellen (hashFiles), nicht am Commit: solange sich kein Bild
      # ändert, greift genau derselbe Cache (kein neuer ~1,5-GB-Cache pro Commit, kein Verdrängen
      # am 10-GB-Repo-Limit). Ändert sich ein Bild, holt restore-keys den letzten Stand, sodass nur
      # die wirklich neuen Bilder codiert werden.
      - name: Astro-Bild-Cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/artwork-originals/**', 'src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Bauen (Daten + i18n-Check + beide Sprachen)
        run: npm run build

      - name: Deploy haushoppe.de (dist-de)
        run: npm run deploy:de

      - name: Deploy haushoppe.art (dist-art)
        run: npm run deploy:art

      # Nutzdaten-Rücklauf: Der Build regeneriert src/data/videos.json aus der YouTube-Playlist;
      # ohne Rück-Commit driftet git vom Live-Stand. Committet wird über eine ALLOWLIST (nie
      # `git add -A`) — ausschließlich Nutzdaten, nie package.json/Lockfiles o. Ä. Ein Wächter
      # bricht ab, falls je etwas anderes gestaged wäre. `[skip ci]` verhindert die
      # Deploy-Schleife (die Live-Seite hat den frischen Stand ja bereits).
      - name: Nutzdaten zurück ins Repo (Allowlist)
        run: |
          set -euo pipefail
          ALLOWLIST=("src/data/videos.json")
          git add -- "${ALLOWLIST[@]}"
          if git diff --cached --quiet; then
            echo "Keine Nutzdaten-Änderung — nichts zu committen."
            exit 0
          fi
          GESTAGED=$(git diff --cached --name-only)
          while IFS= read -r datei; do
            erlaubt=false
            for a in "${ALLOWLIST[@]}"; do [ "$datei" = "$a" ] && erlaubt=true; done
            if [ "$erlaubt" = false ]; then
              echo "::error::Unerwartete Datei gestaged: $datei — Abbruch."
              exit 1
            fi
          done <<< "$GESTAGED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Videos-Liste aus der YouTube-Playlist aktualisieren [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
