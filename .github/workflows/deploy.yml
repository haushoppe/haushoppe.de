name: deploy

# Nach jedem Merge auf main: bauen (Daten + i18n-Check + beide Sprachen) und beide
# Cloudflare-Pages-Projekte automatisch deployen. Schlägt Build oder Check fehl,
# wird NICHT deployt. Manuell auslösbar über „Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Token = Secret (dedizierter CI-Token, nur „Cloudflare Pages: Edit"). Account-ID ist
      # kein Credential und darf im Klartext stehen.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 95a53d0584028b2a64d1a3a991a7fd14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen (Daten + i18n-Check + beide Sprachen)
        run: npm run build

      - name: Deploy haushoppe.de (dist-de)
        run: npm run deploy:de

      - name: Deploy haushoppe.art (dist-art)
        run: npm run deploy:art
