name: CI

# Prüft jeden Pull Request (und Pushes auf main): Ist der Inhalt in DE UND EN
# vollständig, und bauen beide Sprach-Versionen fehlerfrei? Ein roter Lauf =
# der PR darf nicht gemergt werden (siehe Branch-Protection in den Repo-Settings).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Astros Bild-Cache wiederverwenden (wie deploy.yml) — ohne diesen Schritt codierte JEDER
      # CI-Lauf alle ~7000 Bild-Varianten kalt neu (~1 h) und die Läufe stauten sich. Key am Inhalt
      # der Bildquellen, damit sich der Cache bei reinen Code-/Text-Änderungen exakt wiederverwenden lässt.
      - name: Astro-Bild-Cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/artwork-originals/**', 'src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Abgeleitete Daten neu generieren (Beschriftungen + Sprach-Pendants)
        run: npm run data

      - name: i18n-Vollständigkeit prüfen (jedes Werk & jede Seite in DE + EN)
        run: npm run check

      - name: Deutsche Seite bauen (haushoppe.de)
        run: npm run build:de

      - name: Englische Seite bauen (haushoppe.art)
        run: npm run build:art
